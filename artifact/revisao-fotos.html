<title>Guarda-Roupa da Liv</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: header with tabs, sticky toolbar, card grid (one column on phone); each card expands into its editor */
:root{
  --bg:#fbf6f4; --surface:#ffffff; --sunk:#f4ebe7; --line:#eaddd7;
  --fg:#3d302c; --muted:#85746d; --accent:#b4606a; --accent-ink:#ffffff; --accent-soft:#f6e3e3;
  --ok:#4d7a4a; --ok-soft:#e5efe2; --warn:#8a5d1f; --warn-soft:#f8ead2;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d1817; --surface:#28211f; --sunk:#221c1a; --line:#3b312e;
  --fg:#f1e7e3; --muted:#b09f98; --accent:#e0939b; --accent-ink:#2a1215; --accent-soft:#3e2729;
  --ok:#9ccc95; --ok-soft:#24331f; --warn:#e8c48c; --warn-soft:#3a2e1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1817; --surface:#28211f; --sunk:#221c1a; --line:#3b312e;
  --fg:#f1e7e3; --muted:#b09f98; --accent:#e0939b; --accent-ink:#2a1215; --accent-soft:#3e2729;
  --ok:#9ccc95; --ok-soft:#24331f; --warn:#e8c48c; --warn-soft:#3a2e1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:20px 4px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,4.5vw,2.3rem);margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--muted);margin:4px 0 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;font-size:.9rem}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tools input,.tools select{width:auto;flex:1 1 140px}
.save{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-left:auto}
.save .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.save.pending .dot{background:var(--warn)}.save.error .dot{background:var(--accent)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.85rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select,input,textarea{font:inherit;font-size:.92rem;width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--surface);color:var(--fg)}
main{padding-block:14px 48px}
.count{color:var(--muted);font-size:.85rem;margin:0 0 10px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}/* 5 per row on a notebook */
.photo img{cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.open{grid-column:span 2}
.photo{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--sunk);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.85rem}
/* Photos are pinned to their square box so portrait ones fit whole too (they used to overflow and get cut) */
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;transition:transform .2s}
.look .pics div,.mini div,.cjthumb div,.sheet .list button div{position:relative}
.look .pics img,.mini img,.cjthumb img,.sheet .list img{position:absolute;inset:0}
.rot{position:absolute;bottom:8px;right:8px;display:flex;gap:6px}
.rot button{width:36px;height:36px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 88%,transparent);font-size:1.1rem;box-shadow:0 1px 4px rgb(0 0 0 / .18)}
.body{padding:12px;display:grid;gap:8px}
.name{font-weight:700;margin:0;line-height:1.3}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border-radius:99px;padding:3px 9px;font-size:.72rem;font-weight:700;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.alert{background:var(--accent-soft);color:var(--accent)}
.aviso{margin:0;font-size:.82rem;font-weight:700;color:var(--accent)}
.faltam{margin:0;font-size:.8rem;font-weight:700;color:var(--warn)}
.editor{display:grid;gap:8px;background:var(--sunk);border-radius:10px;padding:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:grid;gap:4px;font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
label.f>*{text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg)}
.miss{border-color:var(--warn)!important;background:var(--warn-soft)!important}
label.f:has(.miss){color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 auto}
.danger.armed{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.empty{grid-column:1/-1;text-align:center;border:1px dashed var(--line);border-radius:14px;padding:32px 16px;color:var(--muted)}
/* Category filter: scrollable chip rows (groups, then the selected groups' categories) */
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;min-height:38px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:700;font-size:.86rem;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chiprow.sub .fchip{min-height:32px;padding:5px 11px;font-size:.8rem;font-weight:600}
.chiprow.sub .fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
@media (max-width:560px){.tools #q{flex-basis:100%}.bar{position:static}}/* on phones the tall toolbar scrolls away instead of covering half the screen */
/* Bulk edit: selection boxes and a bar fixed to the bottom edge */
.sel{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--muted)}
.sel input{width:20px;height:20px;accent-color:var(--accent)}
.card.picked{outline:2px solid var(--accent);outline-offset:-2px}
.bulk{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgb(0 0 0 / .12);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bulk .in{max-width:1180px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bulk select,.bulk input[type=text]{width:auto;flex:1 1 130px}
.bulk .n{font-weight:700}
body.has-bulk main{padding-bottom:150px}
/* Conferência: same grid as the catalog, compact fields when a card is opened.
   The photo box stays square so photos rotated by 90° still fit whole. */
.compact .rot{bottom:4px;right:4px;gap:4px}.compact .rot button{width:28px;height:28px;font-size:.9rem}
.compact .body{padding:8px;gap:6px}
.compact .editor{gap:6px;padding:8px}.compact .two{gap:6px}
.compact select,.compact input:not([type=checkbox]),.compact textarea{font-size:.82rem;padding:6px}
.compact label.f{font-size:.66rem;gap:2px}
.compact .btn{padding:6px 8px;font-size:.78rem}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}.card.open{grid-column:auto}}
/* Compras, Looks and Perfil views */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;margin-bottom:14px}
.panel h2{font-family:var(--display);font-size:1.2rem;margin:0}
.panel .hint{margin:0;color:var(--muted);font-size:.85rem}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl td.n{text-align:center;width:70px}.tbl input{width:58px;text-align:center;padding:5px}
.buy{font-weight:700;color:var(--accent)}.okc{color:var(--ok);font-weight:700}
.tbl tr.need td{background:var(--accent-soft);color:var(--accent);font-weight:700}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.mini{display:grid;gap:4px;font-size:.78rem;line-height:1.25}
.mini div{aspect-ratio:1/1;background:var(--sunk);border-radius:10px;overflow:hidden}.mini img{width:100%;height:100%;object-fit:contain}
.mini small{color:var(--muted)}
/* Sets: linked-piece thumbnails and the bottom-sheet picker */
.cj{display:grid;gap:6px}
.cjrow{display:flex;gap:6px;flex-wrap:wrap}
.cjthumb{width:64px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0;overflow:hidden;position:relative}
.cjthumb div{aspect-ratio:1/1;background:var(--sunk)}.cjthumb img{width:100%;height:100%;object-fit:contain}
.linkish{border:0;background:none;padding:0;font-size:.75rem;color:var(--muted);text-decoration:underline;text-align:left}
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .35);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--surface);width:min(900px,100%);max-height:80vh;border-radius:16px 16px 0 0;display:grid;grid-template-rows:auto 1fr;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .head{display:flex;gap:8px;align-items:center;margin-bottom:10px}.sheet .head input{flex:1}
.sheet .list{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;align-content:start}
.sheet .list button{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0;text-align:left;font-size:.75rem;overflow:hidden}
.sheet .list button div{aspect-ratio:1/1;background:var(--sunk)}.sheet .list button img{width:100%;height:100%;object-fit:contain}
.sheet .list button span{display:block;padding:4px 6px}
.scroll{overflow-x:auto}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.look{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid}
.look .pics{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--line)}
.look .pics div{aspect-ratio:1/1;background:var(--sunk);overflow:hidden}.look .pics img{width:100%;height:100%;object-fit:contain}
.look .txt{padding:10px;display:grid;gap:6px;font-size:.85rem}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
@media (prefers-reduced-motion:reduce){.photo img{transition:none}}
</style>

<header class="wrap">
  <h1>Guarda-Roupa da Liv ♡</h1>
  <p class="lede">Tudo é salvo sozinho. Toque numa peça para editar.</p>
</header>
<div class="bar"><div class="wrap">
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="tools" id="tools">
    <input id="q" type="search" placeholder="Buscar peça, marca, tamanho…" aria-label="Buscar">
    <select id="fEst" aria-label="Estação"><option value="">Todas as estações</option><option value="calor">Calor</option><option value="meia">Meia estação</option><option value="frio">Frio</option></select>
    <select id="fServe" aria-label="Serve"><option value="">Serve: todas</option><option value="sim">Serve</option><option value="grande">Ainda grande</option><option value="pequena">Já ficou pequena</option></select>
    <select id="fCor" aria-label="Cor"></select>
    <select id="fFalta" aria-label="O que falta" hidden></select>
    <button class="btn" id="clearF" type="button" hidden>✕ Limpar filtros</button>
    <button class="btn" id="selAll" type="button" hidden>Selecionar todas deste filtro</button>
    <button class="btn primary" id="add" type="button">＋ Nova peça</button>
    <span class="save" id="save"><span class="dot"></span><span id="saveText">Conectando…</span></span>
  </div>
  <div class="chiprow" id="grpChips" aria-label="Filtrar por grupo"></div>
  <div class="chiprow sub" id="subChips" aria-label="Refinar categorias" hidden></div>
</div></div>
<main class="wrap"><p class="count" id="count"></p><section class="grid" id="grid"><div class="empty">Carregando o guarda-roupa…</div></section><section id="view" hidden></section></main>
<div class="bulk" id="bulk" hidden><div class="in">
  <span class="n" id="bulkN"></span>
  <select id="bMarca" aria-label="Marca para aplicar"></select><input type="text" id="bMarcaNova" placeholder="Nova marca" hidden>
  <select id="bTam" aria-label="Tamanho para aplicar"></select><input type="text" id="bTamNovo" placeholder="Novo tamanho" hidden>
  <select id="bEst" aria-label="Estação para aplicar"><option value="">Estação: não mudar</option><option value="calor">Calor</option><option value="meia">Meia estação</option><option value="frio">Frio</option></select>
  <select id="bServe" aria-label="Serve para aplicar"><option value="">Serve: não mudar</option><option value="sim">Serve</option><option value="grande">Ainda grande</option><option value="pequena">Já ficou pequena</option></select>
  <label class="sel"><input type="checkbox" id="bOver"> Substituir o que já está preenchido</label>
  <button class="btn primary" id="bApply" type="button">Aplicar</button>
  <button class="btn" id="bClear" type="button">Limpar seleção</button>
</div></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=null,assets=null,pecas={},tab='catalogo',open=new Set(),picked=new Set(),loaded=false,shown=[];
const cats=['Acessório','Blusa manga curta','Blusa manga longa','Blusa sem manga','Body manga curta','Body manga longa','Body sem manga','Calça','Calçado','Casaco','Chapéu','Colete','Jardineira','Macacão','Meias','Pijama manga curta','Pijama manga longa','Poncho','Saia','Short','Vestido manga curta','Vestido manga longa','Vestido sem manga'];
const seasons=[['','—'],['calor','Calor'],['meia','Meia estação'],['frio','Frio']];
const fits=[['','—'],['sim','Serve'],['grande','Ainda grande'],['pequena','Já ficou pequena']];
// Main colour: chosen by the user, or guessed from the piece name until then
const cores=['Amarelo','Azul','Bege','Branco','Cinza','Colorido','Laranja','Lilás','Marrom','Preto','Rosa','Verde','Vermelho','Vinho'];
const corRules=[[/azu[li]|jeans|marinho/,'Azul'],[/rosa|pink/,'Rosa'],[/branc|off-white/,'Branco'],[/pret/,'Preto'],[/cinza/,'Cinza'],[/verde/,'Verde'],[/amarel|mostarda/,'Amarelo'],
  [/vermelh/,'Vermelho'],[/lil[aá]s|roxo|roxinho/,'Lilás'],[/bege/,'Bege'],[/vinho/,'Vinho'],[/marrom/,'Marrom'],[/laranja/,'Laranja'],[/colorid/,'Colorido']];
function corDe(p){if(p.cor)return p.cor;const n=String(p.nome||'').toLocaleLowerCase('pt-BR');let best=null;
  corRules.forEach(([re,c])=>{const m=n.match(re);if(m&&(!best||m.index<best[0]))best=[m.index,c]});return best?best[1]:''}
const conds=[['nova','Nova'],['boa','Boa'],['desgastada','Desgastada'],['defeito','Com defeito']];
const label=(list,v)=>(list.find(x=>x[0]===v)||[,v||''])[1];
const needsSleeve=c=>['Body','Blusa','Vestido','Pijama'].includes(c);

// ---------- saving: one write at a time per piece, coalesced per pause ----------
const pending={},inflight={},timers={};
function setSave(s,t){$('save').className='save '+s;$('saveText').textContent=t}
function anyPending(){return Object.keys(pending).length||Object.values(inflight).some(Boolean)}
function queue(id,delay){pending[id]=true;setSave('pending','Salvando…');clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),delay??600)}
async function flush(id){if(!pending[id]||!db)return;if(inflight[id]){timers[id]=setTimeout(()=>flush(id),300);return}
  delete pending[id];inflight[id]=true;
  try{await db.collection('pecas').doc(id).set(Object.assign({},pecas[id],{atualizado_em:new Date().toISOString()}))}
  catch(e){pending[id]=true;inflight[id]=false;setSave('error','Não salvou. Verifique a conexão.');return}
  inflight[id]=false;if(!anyPending())setSave('','Tudo salvo')}
function edit(id,patch,delay){pecas[id]=Object.assign({},pecas[id],patch);queue(id,delay)}
window.addEventListener('beforeunload',e=>{if(anyPending()){e.preventDefault();e.returnValue=''}});

// ---------- rules ----------
function missing(p){const m=[],e=k=>!String(p[k]||'').trim();
  if(e('nome'))m.push(['nome','nome']);if(e('categoria'))m.push(['categoria','categoria']);else if(needsSleeve(p.categoria))m.push(['categoria','manga na categoria']);
  if(e('tamanho'))m.push(['tamanho','tamanho']);if(e('marca'))m.push(['marca','marca']);if(e('estacao'))m.push(['estacao','estação']);if(e('serve'))m.push(['serve','serve?']);return m}
// Deleted pieces go to the trash (situacao "excluida"; older "baixa" counts the same) and can be restored
const ativa=p=>p.situacao!=='excluida'&&p.situacao!=='baixa';
// Everything that keeps a piece in Conferência, as [key,label] — used by the "O que falta" filter
function pendencias(p){const r=missing(p).map(x=>x[1]==='manga na categoria'?['manga','Manga na categoria']:[x[0],x[1][0].toUpperCase()+x[1].slice(1)]);
  if(p.aviso)r.push(['aviso','Aviso']);if(!p.foto)r.push(['semfoto','Sem foto']);if(p.refotografar)r.push(['refotografar','Refotografar']);return r}
function precisaConferir(p){return ativa(p)&&(missing(p).length||p.aviso||p.refotografar||!p.foto)}
function lists(){const all=Object.entries(pecas).map(([id,p])=>Object.assign({id},p));
  return{catalogo:all.filter(ativa),conferencia:all.filter(precisaConferir),lixeira:all.filter(p=>!ativa(p))}}

// ---------- rendering ----------
function rotStyle(r){r=((r||0)%360+360)%360;return 'transform:rotate('+r+'deg)'}
function field(p,k,lab,ph){return '<label class="f">'+lab+'<input data-k="'+k+'" data-id="'+esc(p.id)+'" value="'+esc(p[k])+'" placeholder="'+esc(ph||'')+'"></label>'}
function pick(p,k,lab,opts){let cur=String(p[k]||'');if(cur&&!opts.some(o=>o[0]===cur))opts=opts.concat([[cur,cur]]);
  return '<label class="f">'+lab+'<select data-k="'+k+'" data-id="'+esc(p.id)+'">'+opts.map(o=>'<option value="'+esc(o[0])+'"'+(cur===o[0]?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></label>'}
// Brand and size are picked from what already exists; "＋ Novo…" reveals a field to type a new one
const NEW='__nova__';
function distinct(k){const n={};Object.values(pecas).forEach(p=>{const v=String(p[k]||'').trim();if(v)n[v]=(n[v]||0)+1});const l=Object.keys(n);
  return k==='tamanho'?l.sort((a,b)=>sizeRank(a)-sizeRank(b)||a.localeCompare(b,'pt-BR')):l.sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function sizeRank(s){s=s.toUpperCase();const fixed={RN:0,P:1,M:2,G:3,GG:4,U:9999};if(s in fixed)return fixed[s];
  const n=parseFloat((s.match(/\d+/)||[])[0]);if(isNaN(n))return 9000;return /MES/.test(s)?10+n:10+n*12+.5}// sizes "1","2"… are years, after "12 meses"
function listPick(p,k,lab,novo){const cur=String(p[k]||'').trim(),vals=distinct(k);
  return '<label class="f">'+lab+'<select data-k="'+k+'" data-id="'+esc(p.id)+'"><option value="">Escolher…</option>'+vals.map(v=>'<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>').join('')+'<option value="'+NEW+'">＋ '+novo+'…</option></select>'+
  '<input data-k="'+k+'" data-id="'+esc(p.id)+'" data-novo hidden placeholder="'+esc(novo)+'"></label>'}
// ---------- sets (collection "conjuntos": {nome, pecas:[ids]}) ----------
let conjuntos={};
function setOf(id){const e=Object.entries(conjuntos).find(([,c])=>(c.pecas||[]).includes(id));return e||null}
function thumb(id,extra){const p=pecas[id];if(!p)return '';return '<button type="button" class="cjthumb" data-goto="'+esc(id)+'" title="'+esc(p.nome)+'"><div>'+(p.foto?'<img loading="lazy" src="'+esc(p.foto)+'" alt="'+esc(p.nome)+'" style="'+rotStyle(p.rotacao)+'">':'')+'</div>'+(extra||'')+'</button>'}
function conjSection(p){const s=setOf(p.id);if(!s)return '<button type="button" class="btn" data-link="'+esc(p.id)+'">＋ Vincular a um conjunto</button>';
  const[cid,c]=s;return '<div class="cj"><label class="f">Conjunto: '+esc(c.nome||'sem nome')+'</label><div class="cjrow">'+(c.pecas||[]).filter(x=>x!==p.id).map(x=>thumb(x)).join('')+'</div>'+
    '<div class="row"><button type="button" class="btn" data-link="'+esc(p.id)+'">＋ Outra peça</button><button type="button" class="btn" data-leave="'+esc(p.id)+'">Tirar deste conjunto</button></div></div>'}
function saveSet(cid,c){conjuntos[cid]=c;saveDoc('conjuntos',cid,c,0)}
function dropSet(cid){delete conjuntos[cid];db.collection('conjuntos').doc(cid).delete()}
// Linking two pieces joins their sets (or creates one)
function link(a,b){const A=setOf(a),B=setOf(b);
  if(A&&B){if(A[0]===B[0])return;saveSet(A[0],Object.assign({},A[1],{pecas:[...new Set([...A[1].pecas,...B[1].pecas])]}));dropSet(B[0])}
  else if(A)saveSet(A[0],Object.assign({},A[1],{pecas:[...A[1].pecas,b]}));
  else if(B)saveSet(B[0],Object.assign({},B[1],{pecas:[...B[1].pecas,a]}));
  else saveSet('c-'+Date.now().toString(36),{nome:'Conjunto '+(pecas[a].nome||''),pecas:[a,b]})}
function leave(id){const s=setOf(id);if(!s)return;const rest=s[1].pecas.filter(x=>x!==id);rest.length<2?dropSet(s[0]):saveSet(s[0],Object.assign({},s[1],{pecas:rest}))}
// Bottom sheet listing the active pieces with photos; onPick(id) runs on tap
function openPicker(title,exclude,onPick){const el=document.createElement('div');el.className='sheet';
  el.innerHTML='<div class="in" role="dialog" aria-label="'+esc(title)+'"><div class="head"><b>'+esc(title)+'</b><input type="search" placeholder="Buscar peça…" aria-label="Buscar peça"><button type="button" class="btn" data-close>Fechar</button></div><div class="list"></div></div>';
  const list=el.querySelector('.list'),q=el.querySelector('input');
  const draw=()=>{const t=q.value.trim().toLocaleLowerCase('pt-BR');list.innerHTML=Object.entries(pecas).filter(([id,p])=>ativa(p)&&!exclude.includes(id)&&(!t||[p.nome,p.categoria,p.marca].join(' ').toLocaleLowerCase('pt-BR').includes(t)))
    .sort((a,b)=>String(a[1].categoria).localeCompare(String(b[1].categoria),'pt-BR')).map(([id,p])=>'<button type="button" data-pick="'+esc(id)+'"><div>'+(p.foto?'<img loading="lazy" src="'+esc(p.foto)+'" alt="" style="'+rotStyle(p.rotacao)+'">':'')+'</div><span>'+esc(p.nome)+'</span></button>').join('')};
  draw();q.addEventListener('input',draw);
  el.addEventListener('click',e=>{if(e.target===el||e.target.closest('[data-close]')){el.remove();return}const b=e.target.closest('[data-pick]');if(b){el.remove();onPick(b.dataset.pick)}});
  document.body.appendChild(el);q.focus()}
function goTo(id){tab='catalogo';$('q').value='';$('fEst').value='';$('fServe').value='';grpSel.clear();catOff.clear();open.clear();open.add(id);render();
  const el=$('grid').querySelector('[data-card="'+CSS.escape(id)+'"]');if(el)el.scrollIntoView({block:'center'})}
function renderConjuntos(){if(typing())return;const sets=Object.entries(conjuntos).sort((a,b)=>String(a[1].nome).localeCompare(String(b[1].nome),'pt-BR'));
  $('view').innerHTML='<div class="panel"><h2>Conjuntos ('+sets.length+')</h2><p class="hint">Peças que fazem conjunto. Para criar, toque em "＋ Novo conjunto" ou abra uma peça e use "Vincular a um conjunto".</p>'+
    '<button type="button" class="btn primary" id="newSet" style="justify-self:start">＋ Novo conjunto</button></div>'+
    sets.map(([cid,c])=>'<div class="panel"><label class="f">Nome<input data-cjname="'+esc(cid)+'" value="'+esc(c.nome)+'"></label><div class="cjrow">'+
      (c.pecas||[]).map(id=>pecas[id]?'<div style="display:grid;gap:4px;width:96px;font-size:.75rem">'+thumb(id).replace('class="cjthumb"','class="cjthumb" style="width:96px"')+'<span>'+esc(pecas[id].nome)+(ativa(pecas[id])?'':' (na lixeira)')+'</span>'+
        '<button type="button" class="linkish" data-cjremove="'+esc(cid+'|'+id)+'">Tirar do conjunto</button></div>':'').join('')+'</div>'+
      '<div class="row"><button type="button" class="btn" data-cjadd="'+esc(cid)+'">＋ Adicionar peça</button><button type="button" class="btn danger" data-cjdel="'+esc(cid)+'">Desfazer conjunto</button></div></div>').join('')}
function editor(p){return '<div class="editor">'+field(p,'nome','Nome')+pick(p,'categoria','Categoria',[['','Escolher…']].concat(cats.map(c=>[c,c])))+
  '<div class="two">'+listPick(p,'tamanho','Tamanho','Novo tamanho')+listPick(p,'marca','Marca','Nova marca')+'</div>'+
  '<div class="two">'+pick(p,'estacao','Estação',seasons)+pick(p,'serve','Serve na Liv?',fits)+'</div>'+
  '<div class="two">'+pick(Object.assign({},p,{cor:corDe(p)}),'cor','Cor principal',[['','—']].concat(cores.map(c=>[c,c])))+pick(p,'conservacao','Conservação',conds)+'</div>'+conjSection(p)+
  '<label class="f">Observação<textarea rows="2" data-k="notes" data-id="'+esc(p.id)+'">'+esc(p.notes)+'</textarea></label>'+
  '<div class="row"><label class="btn" style="text-align:center">📷 '+(p.foto?'Trocar foto':'Adicionar foto')+'<input type="file" accept="image/*" data-photo="'+esc(p.id)+'" hidden></label>'+
  '<button type="button" class="btn" data-reshoot="'+esc(p.id)+'">'+(p.refotografar?'Já refotografei':'Pôr para refotografar')+'</button>'+
  (p.aviso?'<button type="button" class="btn" data-clearaviso="'+esc(p.id)+'">Resolvi o aviso</button>':'')+'</div>'+
  '<button type="button" class="btn primary" data-savepiece="'+esc(p.id)+'">💾 Salvar e fechar</button>'+
  (ativa(p)?'<button type="button" class="btn danger" data-excluir="'+esc(p.id)+'">🗑 Excluir</button>'
    :'<div class="row"><button type="button" class="btn" data-restaurar="'+esc(p.id)+'">Restaurar</button><button type="button" class="btn danger" data-apagar="'+esc(p.id)+'">Apagar de vez</button></div>')+'</div>'}
function card(p){const m=missing(p),isOpen=open.has(p.id);
  const chips=[p.categoria,p.tamanho,label(seasons,p.estacao),corDe(p)].filter(Boolean).map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+
    (p.serve?'<span class="chip '+(p.serve==='sim'?'ok':'warn')+'">'+esc(label(fits,p.serve))+'</span>':'')+
    (p.conservacao&&p.conservacao!=='boa'?'<span class="chip '+(p.conservacao==='nova'?'ok':'alert')+'">'+esc(label(conds,p.conservacao))+'</span>':'')+
    (p.refotografar?'<span class="chip alert">📷 Refotografar</span>':'')+(setOf(p.id)?'<span class="chip ok">Conjunto</span>':'')+
    (!ativa(p)?'<span class="chip">Na lixeira'+(p.excluida_em||p.baixa_data?' desde '+esc(p.excluida_em||p.baixa_data):'')+'</span>':'');
  return '<article class="card'+(isOpen?' open':'')+(picked.has(p.id)?' picked':'')+'" data-card="'+esc(p.id)+'"><div class="photo">'+
    (p.foto?'<img loading="lazy" src="'+esc(p.foto)+'" alt="'+esc(p.nome)+'" style="'+rotStyle(p.rotacao)+'"><div class="rot"><button type="button" data-rot="-90" data-id="'+esc(p.id)+'" aria-label="Girar para a esquerda">⟲</button><button type="button" data-rot="90" data-id="'+esc(p.id)+'" aria-label="Girar para a direita">⟳</button></div>':'Sem foto')+
    '</div><div class="body">'+(tab==='conferencia'?'<label class="sel"><input type="checkbox" data-pick="'+esc(p.id)+'"'+(picked.has(p.id)?' checked':'')+'> Selecionar</label>':'')+
    '<p class="name">'+esc(p.nome||'Peça sem nome')+'</p><div class="chips">'+chips+'</div>'+
    (p.marca?'<span class="chip" style="justify-self:start">'+esc(p.marca)+'</span>':'')+
    (p.aviso&&ativa(p)?'<p class="aviso">⚠ '+esc(p.aviso)+'</p>':'')+
    (m.length&&ativa(p)?'<p class="faltam">Falta preencher: '+m.map(x=>x[1]).join(', ')+'</p>':'')+
    '<button type="button" class="btn" data-toggle="'+esc(p.id)+'">'+(isOpen?'Fechar':'Editar')+'</button>'+
    (isOpen?editor(p):'')+'</div></article>'}
function markMissing(el){if(!el)return;const p=Object.assign({id:el.dataset.card},pecas[el.dataset.card]);const keys=new Set(missing(p).map(x=>x[0]));
  el.querySelectorAll('[data-k]').forEach(f=>f.classList.toggle('miss',keys.has(f.dataset.k)));
  const t=el.querySelector('.faltam');const m=missing(p);if(t){t.textContent=m.length?'Falta preencher: '+m.map(x=>x[1]).join(', '):'Tudo preenchido ✓'}}
function renderTabs(){const l=lists();$('tabs').innerHTML=[['catalogo','Catálogo',l.catalogo.length],['conferencia','Conferência',l.conferencia.length],['conjuntos','Conjuntos'],['compras','Compras'],['looks','Looks'],['perfil','Perfil'],['lixeira','Lixeira',l.lixeira.length]]
  .map(t=>'<button type="button" role="tab" class="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+(t[2]!==undefined?' ('+t[2]+')':'')+'</button>').join('')}
const VIEWS=['conjuntos','compras','looks','perfil'];
// Category groups used by the multi-select filter; categories are matched by their first word
const groups=[['cima','Partes de cima',['Blusa','Body']],['baixo','Partes de baixo',['Calça','Short','Saia']],['unica','Peças únicas',['Vestido','Jardineira','Macacão']],
  ['pijama','Pijamas',['Pijama']],['agasalho','Agasalhos',['Casaco','Colete','Poncho']],['acessorio','Acessórios',['Meias','Chapéu','Calçado','Acessório']]];
const groupOf=c=>{const w=String(c).split(' ')[0];const g=groups.find(g=>g[2].includes(w));return g?g[0]:'outros'};
// Groups toggle with one tap and combine. The second row narrows the selected groups:
// nothing picked there = every category of the groups; tapping categories (or a type such as "Bodies (todos)") shows only those.
let grpSel=new Set(),catOff=new Set();// catOff keeps its name but now holds the categories picked in the second row
const baseOf=c=>String(c).split(' ')[0];
const plural={Body:'Bodies (todos)',Blusa:'Blusas (todas)',Vestido:'Vestidos (todos)',Pijama:'Pijamas (todos)'};
// A pick narrows only its own group: "Blusa manga curta" + "Partes de baixo" shows those blouses and every bottom
function catOk(c){if(!grpSel.size)return true;const g=groupOf(c);if(!grpSel.has(g))return false;return ![...catOff].some(x=>groupOf(x)===g)||catOff.has(c)}
function renderCats(){const used=[...new Set(Object.values(pecas).filter(ativa).map(p=>p.categoria).filter(Boolean))];
  const gs=groups.concat([['outros','Outros',[]]]).filter(g=>used.some(c=>groupOf(c)===g[0]));
  $('grpChips').innerHTML='<button type="button" class="fchip" data-grp="" aria-pressed="'+!grpSel.size+'">Tudo</button>'+
    gs.map(([k,l])=>'<button type="button" class="fchip" data-grp="'+k+'" aria-pressed="'+grpSel.has(k)+'">'+esc(l)+'</button>').join('');
  const sub=used.filter(c=>grpSel.has(groupOf(c))).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const bases=[...new Set(sub.map(baseOf))].filter(b=>sub.filter(c=>baseOf(c)===b).length>1);
  $('subChips').hidden=sub.length<2;
  $('subChips').innerHTML=bases.map(b=>{const cs=sub.filter(c=>baseOf(c)===b);return '<button type="button" class="fchip" data-subbase="'+esc(b)+'" aria-pressed="'+cs.every(c=>catOff.has(c))+'">'+esc(plural[b]||b+' (todos)')+'</button>'}).join('')+
    sub.map(c=>'<button type="button" class="fchip" data-subcat="'+esc(c)+'" aria-pressed="'+catOff.has(c)+'">'+esc(c)+'</button>').join('')}
$('grpChips').addEventListener('click',e=>{const b=e.target.closest('[data-grp]');if(!b)return;const k=b.dataset.grp;
  if(!k){grpSel.clear();catOff.clear()}else if(grpSel.has(k)){grpSel.delete(k);[...catOff].forEach(c=>{if(groupOf(c)===k)catOff.delete(c)})}else grpSel.add(k);render()});
$('subChips').addEventListener('click',e=>{const b=e.target.closest('[data-subcat],[data-subbase]');if(!b)return;
  if(b.dataset.subcat){const c=b.dataset.subcat;catOff.has(c)?catOff.delete(c):catOff.add(c)}
  else{const used=[...new Set(Object.values(pecas).filter(ativa).map(p=>p.categoria))].filter(c=>grpSel.has(groupOf(c))&&baseOf(c)===b.dataset.subbase),all=used.every(c=>catOff.has(c));
    used.forEach(c=>all?catOff.delete(c):catOff.add(c))}
  render()});
function renderFalta(){const conf=tab==='conferencia';$('fFalta').hidden=!conf;if(!conf)return;const cur=$('fFalta').value,n={};
  lists().conferencia.forEach(p=>pendencias(p).forEach(([k,l])=>{n[k]=n[k]||[l,0];n[k][1]++}));
  $('fFalta').innerHTML='<option value="">Falta: tudo</option>'+Object.entries(n).sort((a,b)=>b[1][1]-a[1][1]).map(([k,[l,c]])=>'<option value="'+k+'"'+(k===cur?' selected':'')+'>Falta: '+esc(l)+' ('+c+')</option>').join('')}
function render(){if(!loaded)return;renderTabs();
  const isView=VIEWS.includes(tab);['tools','grpChips','count','grid'].forEach(i=>$(i).hidden=isView);$('subChips').hidden=true;$('view').hidden=!isView;
  if(isView){picked.clear();renderBulk();({conjuntos:renderConjuntos,compras:renderCompras,looks:renderLooks,perfil:renderPerfil})[tab]();return}
  renderCats();renderFalta();
  {const cur=$('fCor').value,n={};Object.values(pecas).filter(ativa).forEach(p=>{const c=corDe(p)||'sem';n[c]=(n[c]||0)+1});
   $('fCor').innerHTML='<option value="">Cor: todas</option>'+cores.filter(c=>n[c]).map(c=>'<option'+(c===cur?' selected':'')+'>'+c+'</option>').join('')+(n.sem?'<option value="sem"'+(cur==='sem'?' selected':'')+'>Sem cor ('+n.sem+')</option>':'')}
  const fcor=$('fCor').value,q=$('q').value.trim().toLocaleLowerCase('pt-BR'),fe=$('fEst').value,fs=$('fServe').value,ff=tab==='conferencia'?$('fFalta').value:'';
  $('grid').classList.toggle('compact',tab==='conferencia');
  let list=lists()[tab].filter(p=>(!q||[p.nome,p.marca,p.tamanho,p.categoria,p.notes].join(' ').toLocaleLowerCase('pt-BR').includes(q))&&catOk(p.categoria)&&(!fcor||(fcor==='sem'?!corDe(p):corDe(p)===fcor))&&(!fe||p.estacao===fe)&&(!fs||p.serve===fs)&&(!ff||pendencias(p).some(x=>x[0]===ff)));
  list.sort((a,b)=>String(a.categoria).localeCompare(String(b.categoria),'pt-BR')||String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  shown=list.map(p=>p.id);$('selAll').hidden=tab!=='conferencia';renderBulk();
  $('clearF').hidden=!(q||fe||fs||ff||fcor||grpSel.size);
  $('count').textContent=list.length+(list.length===1?' peça':' peças')+(tab==='conferencia'?' com algo a completar':tab==='lixeira'?' na lixeira':'');
  $('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">'+(tab==='conferencia'?'Nada para conferir. Tudo completo ♡':'Nenhuma peça aqui.')+'</div>';
  $('grid').querySelectorAll('[data-card]').forEach(markMissing)}
function refreshCard(id){const el=$('grid').querySelector('[data-card="'+CSS.escape(id)+'"]');renderTabs();if(!el)return;
  if(el.contains(document.activeElement)&&document.activeElement.matches('input:not([type=file]),textarea')){markMissing(el);return}
  const t=document.createElement('div');t.innerHTML=card(Object.assign({id},pecas[id]));const fresh=t.firstElementChild;el.replaceWith(fresh);markMissing(fresh)}

function fillPick(sel,k,lab,novo){const cur=sel.value;sel.innerHTML='<option value="">'+lab+': não mudar</option>'+distinct(k).map(v=>'<option'+(v===cur?' selected':'')+'>'+esc(v)+'</option>').join('')+'<option value="'+NEW+'"'+(cur===NEW?' selected':'')+'>＋ '+novo+'…</option>'}
function renderBulk(){const on=tab==='conferencia'&&picked.size>0;$('bulk').hidden=!on;document.body.classList.toggle('has-bulk',on);if(!on)return;
  $('bulkN').textContent=picked.size+(picked.size===1?' selecionada':' selecionadas');
  if(!document.activeElement||!$('bulk').contains(document.activeElement)){fillPick($('bMarca'),'marca','Marca','Nova marca');fillPick($('bTam'),'tamanho','Tamanho','Novo tamanho')}}

$('selAll').addEventListener('click',()=>{shown.forEach(id=>picked.add(id));render()});
$('bClear').addEventListener('click',()=>{picked.clear();render()});
$('bApply').addEventListener('click',()=>{
  const val=(s,i)=>s.value===NEW?i.value.trim():s.value,patch={marca:val($('bMarca'),$('bMarcaNova')),tamanho:val($('bTam'),$('bTamNovo')),estacao:$('bEst').value,serve:$('bServe').value},over=$('bOver').checked;
  Object.keys(patch).forEach(k=>{if(!patch[k])delete patch[k]});if(!Object.keys(patch).length){setSave('error','Escolha o que aplicar.');return}
  let n=0;picked.forEach(id=>{const p=pecas[id];if(!p)return;const ch={};Object.entries(patch).forEach(([k,v])=>{if(over||!String(p[k]||'').trim())ch[k]=v});if(Object.keys(ch).length){edit(id,ch,0);n++}});
  picked.clear();['bMarca','bTam','bEst','bServe'].forEach(i=>$(i).value='');$('bMarcaNova').value='';$('bTamNovo').value='';$('bMarcaNova').hidden=$('bTamNovo').hidden=true;$('bOver').checked=false;
  render();setSave('pending','Aplicado em '+n+(n===1?' peça':' peças')+'. Salvando…')});

// ---------- events ----------
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;open.clear();picked.clear();render();window.scrollTo({top:0})}});
['q','fCor','fEst','fServe','fFalta'].forEach(id=>$(id).addEventListener('input',render));

// Tapping the photo opens or closes the piece's editor
$('grid').addEventListener('click',e=>{const img=e.target.closest('.photo img');if(!img)return;const id=img.closest('[data-card]').dataset.card;open.has(id)?open.delete(id):open.add(id);refreshCard(id)});
$('grid').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.link){const id=d.link,s=setOf(id);openPicker('Vincular a qual peça?',s?s[1].pecas:[id],other=>{link(id,other);refreshCard(id)});return}
  if(d.leave){leave(d.leave);refreshCard(d.leave);return}
  if(d.goto){goTo(d.goto);return}
  // Saves right away (instead of waiting for the pause) and closes the editor
  if(d.savepiece){const id=d.savepiece;document.activeElement&&document.activeElement.blur();clearTimeout(timers[id]);
    const done=()=>{open.delete(id);refreshCard(id);setSave('','Salvo ✓')};if(pending[id]){flush(id).then(()=>{if(!pending[id])done()})}else done();return}
  if(d.toggle){open.has(d.toggle)?open.delete(d.toggle):open.add(d.toggle);refreshCard(d.toggle)}

function minis(list){return '<div class="minis">'+list.map(([id,p])=>'<div class="mini"><div>'+(p.foto?'<img loading="lazy" src="'+esc(p.foto)+'" alt="'+esc(p.nome)+'" style="'+rotStyle(p.rotacao)+'">':'')+'</div>'+

function renderCompras(){if(typing())return;const{cur,next,months}=seasons3(),a=tabelaCompras(cur,perfil.tamanho_atual);
  const repor=Object.entries(pecas).filter(([,p])=>ativa(p)&&p.serve==='sim'&&['desgastada','defeito'].includes(p.conservacao)),pequenas=Object.entries(pecas).filter(([,p])=>ativa(p)&&p.serve==='pequena');

// ---------- Looks: rule-based combinations (top + bottom, or one-piece; coat when cold) ----------
let lookSeason='',lookSeed=1,montando=null,montarSoEst=true;
// montar look à mão: lista de ids escolhidos (null = fora do modo); mostra só peças com foto que servem
function montarHtml(s){const cand=Object.entries(pecas).map(([id,p])=>Object.assign({id},p)).filter(p=>usable(p)&&p.foto&&(!montarSoEst||fitsSeason(p,s))).sort((a,b)=>String(a.categoria).localeCompare(String(b.categoria),'pt-BR')||String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  const sel=montando.map(id=>pecas[id]&&Object.assign({id},pecas[id])).filter(Boolean);
  return '<div class="panel"><h2>Montar look</h2><p class="hint">Toque nas peças para juntar. Toque de novo para tirar.</p>'+
    '<div class="row"><select id="lookS" aria-label="Estação">'+seasons.slice(1).map(o=>'<option value="'+o[0]+'"'+(o[0]===s?' selected':'')+'>'+o[1]+'</option>').join('')+'</select><label><input type="checkbox" id="montarSo"'+(montarSoEst?' checked':'')+'> Só peças desta estação</label></div>'+
    '<h2 style="margin-top:12px">No look ('+sel.length+')</h2>'+(sel.length?'<div class="look-sel" style="display:flex;flex-wrap:wrap;gap:8px">'+sel.map(p=>'<button type="button" class="btn" data-mtoggle="'+esc(p.id)+'" style="display:flex;align-items:center;gap:6px"><img src="'+esc(p.foto)+'" alt="" style="width:48px;height:48px;object-fit:contain;'+rotStyle(p.rotacao)+'"><span>'+esc(p.nome)+' ✕</span></button>').join('')+'</div>':'<p class="hint">Nenhuma peça ainda.</p>')+
    '<div class="row" style="margin-top:10px"><button type="button" class="btn primary" id="montarSalvar"'+(sel.length?'':' disabled')+'>♡ Salvar look</button><button type="button" class="btn" id="montarFim">Voltar às ideias</button></div>'+
    '<h2 style="margin-top:12px">Peças ('+cand.length+')</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px">'+
    cand.map(p=>'<button type="button" data-mtoggle="'+esc(p.id)+'" aria-pressed="'+(montando.includes(p.id))+'" style="display:grid;gap:4px;padding:6px;text-align:left;border:2px solid '+(montando.includes(p.id)?'#b5545c':'transparent')+';background:#fff;border-radius:8px"><div style="aspect-ratio:1;position:relative"><img loading="lazy" src="'+esc(p.foto)+'" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;'+rotStyle(p.rotacao)+'"></div><span style="font-size:12px">'+esc(p.nome)+'</span></button>').join('')+'</div></div>'}
const rnd=()=>{lookSeed=(lookSeed*16807)%2147483647;return lookSeed/2147483647};
const pickOne=a=>a[Math.floor(rnd()*a.length)];
const NEUTRAS=['Branco','Bege','Cinza','Preto','Azul','Marrom'],HARMONIA=[['Rosa','Lilás'],['Rosa','Vinho'],['Vermelho','Vinho'],['Verde','Amarelo'],['Laranja','Amarelo'],['Laranja','Vermelho'],['Lilás','Vinho'],['Verde','Azul']];
// cores iguais, neutras ou em harmonia combinam; duas cores vivas diferentes não; "Colorido" só com neutra
function combina(a,b){const x=corDe(a),y=corDe(b);if(!x||!y||x===y)return true;if(x==='Colorido'||y==='Colorido')return NEUTRAS.includes(x==='Colorido'?y:x);if(NEUTRAS.includes(x)||NEUTRAS.includes(y))return true;return HARMONIA.some(([m,n])=>(m===x&&n===y)||(m===y&&n===x))}
function gerarLooks(s){const all=Object.entries(pecas).map(([id,p])=>Object.assign({id},p)).filter(p=>usable(p)&&p.foto&&fitsSeason(p,s)),w=p=>String(p.categoria).split(' ')[0],
  tops=all.filter(p=>['Blusa','Body'].includes(w(p))&&(s==='frio'?/longa/.test(p.categoria):s==='calor'?!/longa/.test(p.categoria):true)),
  bottoms=all.filter(p=>(s==='calor'?['Short','Saia']:s==='frio'?['Calça']:['Short','Saia','Calça']).includes(p.categoria)),
  unicas=all.filter(p=>['Vestido','Jardineira','Macacão'].includes(w(p))),coats=all.filter(p=>['Casaco','Colete','Poncho'].includes(p.categoria)),
  acessorios=all.filter(p=>['Chapéu','Meias','Acessório'].includes(p.categoria));
  const par=t=>{for(let k=0;k<15;k++){const b=pickOne(bottoms);if(combina(t,b))return b}return null};
  const out=[],seen=new Set();for(let i=0;i<60&&out.length<8;i++){let l=[];
    if(unicas.length&&(!tops.length||!bottoms.length||rnd()<.35))l=[pickOne(unicas)];else if(tops.length&&bottoms.length){const t=pickOne(tops),b=par(t);if(!b)continue;l=[t,b]}else break;
    if(s==='frio'&&coats.length){const c=pickOne(coats);if(l.every(p=>combina(p,c)))l.push(c)}
    if(acessorios.length&&rnd()<.5){const a=pickOne(acessorios);if(l.every(p=>combina(p,a)))l.push(a)}
    const k=l.map(p=>p.id).sort().join('|');if(!seen.has(k)){seen.add(k);out.push(l)}}
  return out}
function lookCard(l,saved){return '<div class="look"><div class="pics">'+l.map(p=>'<div><img loading="lazy" src="'+esc(p.foto)+'" alt="'+esc(p.nome)+'" style="'+rotStyle(p.rotacao)+'"></div>').join('')+'</div>'+
  '<div class="txt">'+l.map(p=>'<span>'+esc(p.nome)+'</span>').join('')+(saved?'<button type="button" class="btn" data-unsave="'+esc(saved)+'">Remover dos favoritos</button>':'<button type="button" class="btn primary" data-save="'+esc(l.map(p=>p.id).join('|'))+'">♡ Salvar look</button>')+'</div></div>'}
function renderLooks(){const s=lookSeason||seasons3().cur,looks=gerarLooks(s);
  const fav=Object.entries(looksSalvos).map(([id,d])=>[id,(d.pecas||[]).map(pid=>pecas[pid]&&Object.assign({id:pid},pecas[pid])).filter(Boolean)]).filter(x=>x[1].length);
  if(montando){$('view').innerHTML=montarHtml(s)+'<div class="panel" style="margin-top:14px"><h2>Looks salvos ('+fav.length+')</h2>'+(fav.length?'<div class="looks">'+fav.map(([id,l])=>lookCard(l,id)).join('')+'</div>':'<p class="hint">Toque em "♡ Salvar look" para guardar os favoritos.</p>')+'</div>';return}
  $('view').innerHTML='<div class="panel"><h2>Ideias de looks</h2><p class="hint">Combinações com o que serve e está em bom estado. Ainda sem IA: as combinações são sorteadas por regra (parte de cima + parte de baixo, ou peça única; casaco no frio). As cores são combinadas (neutras e cores em harmonia), e às vezes entra um acessório (chapéu, meias).</p>'+
    '<div class="row"><select id="lookS" aria-label="Estação">'+seasons.slice(1).map(o=>'<option value="'+o[0]+'"'+(o[0]===s?' selected':'')+'>'+o[1]+'</option>').join('')+'</select><button type="button" class="btn primary" id="lookMore">↻ Outras ideias</button><button type="button" class="btn" id="montarIniciar">✎ Montar look</button></div></div>'+
    (looks.length?'<div class="looks">'+looks.map(l=>lookCard(l)).join('')+'</div>':'<div class="empty">Ainda não há peças suficientes desta estação com "serve" marcado.</div>')+
    '<div class="panel" style="margin-top:14px"><h2>Looks salvos ('+fav.length+')</h2>'+(fav.length?'<div class="looks">'+fav.map(([id,l])=>lookCard(l,id)).join('')+'</div>':'<p class="hint">Toque em "♡ Salvar look" para guardar os favoritos.</p>')+'</div>'}
$('view').addEventListener('change',e=>{if(e.target.id==='lookS'){lookSeason=e.target.value;renderLooks()}if(e.target.id==='montarSo'){montarSoEst=e.target.checked;renderLooks()}});
$('view').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='montarIniciar'){montando=[];renderLooks();return}

  if(b.dataset.delmed){if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirmar';return}const id=b.dataset.delmed;delete medidas[id];db.collection('medidas').doc(id).delete();renderPerfil()}
  if(b.id==='savePerfil'){document.querySelectorAll('#view [data-pf]').forEach(i=>{perfil[i.dataset.pf]=i.value});
    db.collection('perfil').doc('principal').set(Object.assign({},perfil,{atualizado_em:new Date().toISOString()}))
      .then(()=>{const o=$('perfilOk');if(o)o.textContent='Perfil salvo ✓';setSave('','Tudo salvo')},()=>setSave('error','Não salvou. Verifique a conexão.'));return}
  if(b.id==='addMed'){const v=k=>$('m_'+k).value.trim(),d={data:v('data')||new Date().toISOString().slice(0,10),altura:v('altura'),peso:v('peso'),cintura:v('cintura'),pe:v('pe'),torax:v('torax')};
    if(!d.altura&&!d.peso&&!d.cintura&&!d.pe&&!d.torax){setSave('error','Preencha pelo menos uma medida.');return}const id='m-'+d.data+'-'+Date.now().toString(36);medidas[id]=d;saveDoc('medidas',id,d,0);
    ['altura','peso','cintura','pe','torax'].forEach(k=>$('m_'+k).value='');renderPerfil()}});

    '<button type="button" class="btn primary" id="addMed" style="justify-self:start">💾 Salvar medida</button>'+
    (ms.length?'<div class="scroll"><table class="tbl"><thead><tr><th>Data</th><th>Altura</th><th>Peso</th><th>Cintura</th><th>Pé</th><th>Tórax</th><th></th></tr></thead><tbody>'+
      ms.map(([id,m])=>'<tr><td>'+esc(String(m.data).split('-').reverse().join('/'))+'</td><td>'+esc(m.altura)+'</td><td>'+esc(m.peso)+'</td><td>'+esc(m.cintura)+'</td><td>'+esc(m.pe)+'</td><td>'+esc(m.torax)+'</td><td><button type="button" class="btn danger" data-delmed="'+esc(id)+'">Apagar</button></td></tr>').join('')+'</tbody></table></div>':'<p class="hint">Nenhuma medida anotada ainda.</p>')+'</div>'}
$('view').addEventListener('input',e=>{const i=e.target;if(i.dataset.cjname){const cid=i.dataset.cjname;conjuntos[cid]=Object.assign({},conjuntos[cid],{nome:i.value});saveDoc('conjuntos',cid,conjuntos[cid])}});
$('view').addEventListener('input',e=>{const i=e.target;if(i.dataset.pf){perfil=Object.assign({},perfil,{[i.dataset.pf]:i.value});saveDoc('perfil','principal',perfil,i.tagName==='SELECT'||i.type==='date'?0:600)}});

// ---------- data ----------
(async function start(){
  db=await claude.use('db');
  if(!db){setSave('error','Sem conexão');$('grid').innerHTML='<div class="empty">Abra esta página pelo claude.ai, com seu login, para ver o guarda-roupa.</div>';return}
  claude.use('assets').then(a=>{assets=a});
  setSave('','Tudo salvo');
  db.collection('pecas').onSnapshot(s=>{const first=!loaded;
    s.docChanges().forEach(ch=>{const id=ch.doc.id;if(pending[id]||inflight[id])return;if(ch.type==='removed')delete pecas[id];else pecas[id]=Object.assign({},ch.doc.data())});
    loaded=true;if(first||VIEWS.includes(tab))render();else s.docChanges().forEach(ch=>refreshCard(ch.doc.id))},()=>setSave('error','A conexão caiu. Recarregue a página.'));
  const small=(col,set)=>db.collection(col).onSnapshot(s=>{set(Object.fromEntries(s.docs.map(d=>[d.id,d.data()])));if(VIEWS.includes(tab)&&!typing())render()},()=>{});
  small('perfil',m=>{perfil=Object.assign({},m.principal)});small('medidas',m=>{medidas=m});small('config',m=>{config=Object.assign({},m.compras)});small('looks',m=>{looksSalvos=m});
  db.collection('conjuntos').onSnapshot(s=>{conjuntos=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));if(VIEWS.includes(tab)){if(!typing())render()}else open.forEach(id=>refreshCard(id))},()=>{});
})();
})();
</script>
