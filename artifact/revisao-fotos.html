<title>Revisão do Guarda-Roupa da Liv</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: sticky progress header, filter chips, one card per photo (grid on desktop, single column on phone) */
:root{
  --bg:#fbf6f4; --surface:#ffffff; --sunk:#f4ebe7; --line:#eaddd7;
  --fg:#3d302c; --muted:#85746d; --accent:#b4606a; --accent-ink:#ffffff; --accent-soft:#f6e3e3;
  --ok:#4d7a4a; --ok-soft:#e5efe2; --new:#8a5d1f; --new-soft:#f8ead2;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d1817; --surface:#28211f; --sunk:#221c1a; --line:#3b312e;
  --fg:#f1e7e3; --muted:#b09f98; --accent:#e0939b; --accent-ink:#2a1215; --accent-soft:#3e2729;
  --ok:#9ccc95; --ok-soft:#24331f; --new:#e8c48c; --new-soft:#3a2e1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1817; --surface:#28211f; --sunk:#221c1a; --line:#3b312e;
  --fg:#f1e7e3; --muted:#b09f98; --accent:#e0939b; --accent-ink:#2a1215; --accent-soft:#3e2729;
  --ok:#9ccc95; --ok-soft:#24331f; --new:#e8c48c; --new-soft:#3a2e1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:22px 6px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,4.5vw,2.3rem);margin:0;text-wrap:balance;letter-spacing:-.01em}
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meter{flex:1;min-width:140px;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.count{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem}
.save{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.save .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.save.pending .dot{background:var(--new)}
.save.error .dot{background:var(--accent)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:700;font-size:.85rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.84rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{padding-block:16px 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.done{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.photo{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--sunk);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .2s}
.rot{position:absolute;bottom:8px;display:flex;gap:6px;right:8px}
.rot button{width:38px;height:38px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 88%,transparent);font-size:1.15rem;box-shadow:0 1px 4px rgb(0 0 0 / .18)}
.body{padding:12px;display:grid;gap:9px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.file{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{border-radius:99px;padding:3px 9px;font-size:.72rem;font-weight:700;background:var(--sunk);color:var(--muted)}
.tag.linked{background:var(--ok-soft);color:var(--ok)}.tag.new{background:var(--new-soft);color:var(--new)}
.miss{border-color:var(--new)!important;background:var(--new-soft)!important}
label.f:has(.miss){color:var(--new)}
.faltam{font-size:.8rem;color:var(--new);font-weight:700;margin:0}
.confirm{border:0;border-radius:10px;padding:12px;font-weight:700;font-size:.95rem;background:var(--ok);color:var(--surface)}
.confirm[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok)}
.qbtn.del.armed{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.reshoot{margin:0;font-size:.82rem;font-weight:700;color:var(--accent)}
.linkish{border:0;background:none;padding:0;font-size:.8rem;color:var(--muted);text-decoration:underline;text-align:left;justify-self:start}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 8px;font-weight:700;font-size:.9rem}
.qbtn[aria-pressed="true"]{background:var(--new-soft);border-color:var(--new);color:var(--new)}
.qbtn.del{color:var(--muted)}.qbtn.del[aria-pressed="true"]{background:var(--sunk);border-color:var(--muted);color:var(--fg)}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.use{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:9px;text-align:left;font-weight:700;font-size:.85rem}
select,input,textarea{font:inherit;font-size:.92rem;width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--surface);color:var(--fg)}
.extra{display:grid;gap:8px;background:var(--sunk);border-radius:10px;padding:9px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:grid;gap:4px;font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
label.f>*{text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg)}
details summary{font-size:.8rem;color:var(--muted);cursor:pointer}details textarea{margin-top:6px;resize:vertical}
.empty{grid-column:1/-1;text-align:center;border:1px dashed var(--line);border-radius:14px;padding:32px 16px;color:var(--muted)}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.photo img,.meter>div{transition:none}}
</style>

<header class="wrap">
  <h1>Revisão das fotos ♡</h1>
  <p class="lede">Para cada foto, escolha a peça do catálogo ou marque como peça nova. Tudo é salvo sozinho enquanto você escolhe e digita.</p>
</header>
<div class="bar"><div class="wrap">
  <div class="bar-row">
    <div class="meter" aria-hidden="true"><div id="meter"></div></div>
    <span class="count" id="count">Carregando…</span>
    <span class="save" id="save"><span class="dot"></span><span id="saveText">Conectando…</span></span>
    <button class="btn" id="refreshList" type="button">↻ Atualizar lista</button>
    <button class="btn" id="saveNow" type="button">Salvar agora</button>
  </div>
  <nav class="chips" id="chips" aria-label="Filtrar fotos"></nav>
</div></div>
<main class="wrap"><section class="grid" id="grid"><div class="empty">Carregando as fotos e o catálogo…</div></section></main>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=null,photos=[],catalog=[],byId={},decisions={},filter='pendentes',ready={fotos:false,catalogo:false,decisoes:false};
const others=[['nova','Peça nova (cadastrar depois)'],['repetida','Foto repetida (descartar)'],['duvida','Não sei / tenho dúvida'],['excluida','Excluída (não cadastrar)']];
// Sleeve is part of the category for tops, bodies and dresses (decided with the user)
const cats=['Acessório','Blusa manga curta','Blusa manga longa','Blusa sem manga','Body manga curta','Body manga longa','Body sem manga','Calça','Calçado','Casaco','Chapéu','Colete','Conjunto','Jardineira','Macacão','Meias','Pijama manga curta','Pijama manga longa','Poncho','Saia','Short','Vestido manga curta','Vestido manga longa','Vestido sem manga'];
const seasons=[['','—'],['calor','Calor'],['meia','Meia estação'],['frio','Frio']];
const conds=[['','—'],['nova','Nova'],['boa','Boa'],['desgastada','Desgastada'],['defeito','Com defeito']];
const fits=[['','A conferir'],['sim','Sim, serve'],['grande','Ainda grande'],['pequena','Já ficou pequena']];
const pieceLabel=c=>c.nome+(c.tamanho||c.marca?' · '+[c.tamanho,c.marca].filter(Boolean).join(' · '):'');

// ---------- saving: one write at a time per photo, coalesced per pause ----------
const pending={},inflight={},timers={};
function setSave(state,text){$('save').className='save '+state;$('saveText').textContent=text}
function anyPending(){return Object.keys(pending).length||Object.values(inflight).some(Boolean)}
function queue(photo,delay){decisions[photo]=Object.assign({},decisions[photo]);pending[photo]=true;setSave('pending','Salvando…');
  clearTimeout(timers[photo]);timers[photo]=setTimeout(()=>flush(photo),delay??600)}
async function flush(photo){if(!pending[photo]||!db)return;if(inflight[photo]){timers[photo]=setTimeout(()=>flush(photo),300);return}
  delete pending[photo];inflight[photo]=true;
  try{await db.collection('decisoes').doc(photo).set(Object.assign({},decisions[photo],{atualizado_em:new Date().toISOString()}))}
  catch(e){pending[photo]=true;setSave('error','Não salvou. Verifique a conexão e toque em Salvar agora.');inflight[photo]=false;return}
  inflight[photo]=false;if(!anyPending())setSave('','Tudo salvo')}
$('saveNow').addEventListener('click',()=>{Object.keys(pending).forEach(p=>{clearTimeout(timers[p]);flush(p)});if(!anyPending())setSave('','Tudo salvo')});
window.addEventListener('beforeunload',e=>{if(anyPending()){e.preventDefault();e.returnValue=''}});

// ---------- decisions ----------
function value(p){const d=decisions[p.id]||{};if(d.status==='ja-cadastrada'&&byId[d.match])return d.match;return others.some(o=>o[0]===d.status)?d.status:''}
function kind(v){return !v?'pendentes':byId[v]?'vinculadas':v==='nova'?'novas':v}
// A photo leaves "A conferir" only when it is excluded or its decision was confirmed
// Answers given before the Confirm button existed have no `confirmado` field and count as confirmed
const isConfirmed=d=>d.confirmado??true;
function group(p){const v=value(p),d=decisions[p.id]||{};return v==='excluida'?'excluida':(v&&isConfirmed(d))?'conferidas':'pendentes'}
function reshoot(p){const d=decisions[p.id]||{};return d.refotografar??!!p.refotografar}
function setChoice(photo,v){const d=Object.assign({},decisions[photo]);if(!v){d.status='a-conferir';d.match=''}else if(byId[v]){d.status='ja-cadastrada';d.match=v}else{d.status=v;d.match=''}
  d.confirmado=false;// a new choice needs a new confirmation
  if((v==='nova'||byId[v])&&!d.conservacao)d.conservacao=defaults.conservacao;
  // "Peça nova" starts from the photo's suggestion; only empty fields are filled, nothing typed is overwritten
  if(v==='nova'){const s=(photos.find(x=>x.id===photo)||{}).sugestao||{};['nome','categoria','estacao','conjunto'].forEach(k=>{if(s[k]&&!String(d[k]||'').trim())d[k]=s[k]})}
  decisions[photo]=d;queue(photo,0)}

// ---------- rendering ----------
function optionsHtml(){const cs=[...new Set(catalog.map(c=>c.categoria))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  return '<optgroup label="Não está no catálogo">'+others.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('')+'</optgroup>'+
  cs.map(cat=>'<optgroup label="'+esc(cat)+'">'+catalog.filter(c=>c.categoria===cat).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).map(c=>'<option value="'+esc(c.id)+'">'+esc(pieceLabel(c))+'</option>').join('')+'</optgroup>').join('')}
function tag(v){if(!v)return '<span class="tag">A conferir</span>';if(byId[v])return '<span class="tag linked">Vinculada</span>';return '<span class="tag new">'+esc(others.find(o=>o[0]===v)[1].split(' (')[0])+'</span>'}
function rotStyle(r){r=((r||0)%360+360)%360;return 'transform:rotate('+r+'deg)'}
function field(photo,k,label,ph){const d=decisions[photo]||{};return '<label class="f">'+label+'<input data-k="'+k+'" data-p="'+esc(photo)+'" value="'+esc(d[k])+'" placeholder="'+esc(ph)+'"></label>'}
const defaults={conservacao:'boa'};// shown and saved when the field was never chosen
function pick(photo,k,label,opts){const d=decisions[photo]||{},cur=String(d[k]||defaults[k]||'').trim();if(cur&&!opts.some(o=>o[0]===cur))opts=opts.concat([[cur,cur]]);
  return '<label class="f">'+label+'<select data-k="'+k+'" data-p="'+esc(photo)+'">'+opts.map(o=>'<option value="'+esc(o[0])+'"'+(cur===o[0]?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></label>'}
function extra(p,v){const c=byId[v]||{};
  if(byId[v]||v==='nova')return '<div class="extra">'+(v==='nova'?field(p.id,'nome','Nome da peça','Ex.: Calça floral branca')+pick(p.id,'categoria','Categoria',[['','Escolher…']].concat(cats.map(x=>[x,x]))):'')+
    '<div class="two">'+field(p.id,'tamanho','Tamanho',c.tamanho||'Ex.: 2')+field(p.id,'marca','Marca',c.marca||'Ex.: Kyly')+'</div>'+
    '<div class="two">'+pick(p.id,'estacao','Estação',seasons)+pick(p.id,'serve','Serve na Liv?',fits)+'</div>'+
    pick(p.id,'conservacao','Conservação',conds)+
    field(p.id,'conjunto','Faz conjunto com (opcional)',c.conjunto||'Ex.: short da foto 112-1')+'</div>';
  if(v==='repetida')return '<div class="extra">'+pick(p.id,'igual_a','Mesma peça da foto',[['','Escolher foto…']].concat(photos.filter(x=>x.id!==p.id).map(x=>[x.id,x.id])))+'</div>';return ''}
function card(p){const v=value(p),d=decisions[p.id]||{},cand=byId[p.candidate_id],ok=!!(v&&isConfirmed(d)),rs=reshoot(p);
  return '<article class="card'+(ok||v==='excluida'?' done':'')+'" data-card="'+esc(p.id)+'"><div class="photo"><img loading="lazy" src="'+esc(p.url)+'" alt="Foto '+esc(p.id)+'" style="'+rotStyle(d.rotacao)+'">'+
  '<div class="rot"><button type="button" data-rot="-90" data-p="'+esc(p.id)+'" aria-label="Girar para a esquerda">⟲</button><button type="button" data-rot="90" data-p="'+esc(p.id)+'" aria-label="Girar para a direita">⟳</button></div></div>'+
  '<div class="body"><div class="top">'+tag(v)+(ok?'<span class="tag linked">✓ Confirmada</span>':'')+'<span class="file">'+esc(p.id)+'</span></div>'+
  (rs?'<p class="reshoot">📷 Refotografar'+(p.refotografar?': '+esc(p.refotografar):'')+'</p>':'')+
  '<div class="quick"><button type="button" class="qbtn" data-quick="nova" data-p="'+esc(p.id)+'" aria-pressed="'+(v==='nova')+'">＋ Peça nova</button>'+
  '<button type="button" class="qbtn del" data-quick="excluida" data-p="'+esc(p.id)+'" aria-pressed="'+(v==='excluida')+'">Excluir</button></div>'+
  (p.candidate_match?'<p class="hint">Sugestão: '+esc(p.candidate_match)+'</p>':'')+
  (cand&&v!==cand.id?'<button type="button" class="use" data-use="'+esc(p.id)+'" data-id="'+esc(cand.id)+'">✓ É esta: '+esc(pieceLabel(cand))+'</button>':'')+
  '<select data-main="'+esc(p.id)+'" aria-label="Peça do catálogo"><option value="">Escolher peça…</option>'+optionsHtml()+'</select>'+extra(p,v)+'<p class="faltam" data-faltam hidden></p>'+
  (v&&v!=='excluida'?'<button type="button" class="confirm" data-confirm="'+esc(p.id)+'" aria-pressed="'+ok+'">'+(ok?'✓ Confirmada · tocar para reabrir':'✓ Confirmar')+'</button>':'')+
  '<button type="button" class="linkish" data-reshoot="'+esc(p.id)+'">'+(rs?'Tirar da lista de refotografar':'📷 Pôr na lista de refotografar')+'</button>'+
  '<details'+(d.notes?' open':'')+'><summary>Observação</summary><textarea rows="2" data-k="notes" data-p="'+esc(p.id)+'" placeholder="Ex.: tamanho na etiqueta, mancha, ganhou de…">'+esc(d.notes)+'</textarea></details></div></article>'}
// Fields still to fill for this decision: [field key, label]
const needsSleeve=c=>['Body','Blusa','Vestido','Pijama'].includes(c);
function missing(id,v){const d=decisions[id]||{},c=byId[v]||{},m=[],e=k=>!String(d[k]||'').trim();
  if(v==='nova'){if(e('nome'))m.push(['nome','nome']);if(e('categoria'))m.push(['categoria','categoria']);else if(needsSleeve(String(d.categoria).trim()))m.push(['categoria','manga na categoria'])}
  if(v==='nova'||byId[v]){if(e('tamanho')&&!c.tamanho)m.push(['tamanho','tamanho']);if(e('marca')&&!c.marca)m.push(['marca','marca']);if(e('estacao'))m.push(['estacao','estação']);if(e('serve'))m.push(['serve','serve?'])}
  if(v==='repetida'&&e('igual_a'))m.push(['igual_a','foto igual']);return m}
function markMissing(el){if(!el)return;const id=el.dataset.card,p=photos.find(x=>x.id===id);if(!p)return;const m=missing(id,value(p)),keys=new Set(m.map(x=>x[0]));
  el.querySelectorAll('[data-k]').forEach(f=>f.classList.toggle('miss',keys.has(f.dataset.k)));
  const t=el.querySelector('[data-faltam]');t.hidden=!m.length;t.textContent=m.length?'Falta preencher: '+m.map(x=>x[1]).join(', '):''}
function counts(){const c={pendentes:0,conferidas:0,excluida:0,vinculadas:0,novas:0,repetida:0,duvida:0,refotografar:0,todas:photos.length};
  photos.forEach(p=>{const g=group(p),k=kind(value(p));c[g]++;if(g!=='excluida'&&k!=='pendentes')c[k]++;if(reshoot(p))c.refotografar++});return c}
function inFilter(p){if(filter==='todas')return true;if(filter==='refotografar')return reshoot(p);const g=group(p);
  if(['pendentes','conferidas','excluida'].includes(filter))return g===filter;return g!=='excluida'&&kind(value(p))===filter}
function renderBar(){const c=counts(),done=c.todas-c.pendentes;$('meter').style.width=(photos.length?done/photos.length*100:0)+'%';$('count').textContent=done+' de '+photos.length+' resolvidas';
  $('chips').innerHTML=[['pendentes','A conferir'],['conferidas','Conferidas'],['todas','Todas'],['vinculadas','Vinculadas'],['novas','Peças novas'],['repetida','Repetidas'],['duvida','Dúvidas'],['refotografar','Refotografar'],['excluida','Excluídas']].map(f=>'<button type="button" class="chip" data-filter="'+f[0]+'" aria-pressed="'+(filter===f[0])+'">'+f[1]+' ('+c[f[0]]+')</button>').join('')}
function syncMain(el){const p=photos.find(x=>x.id===el.dataset.main);if(p)el.value=value(p)}
function render(){if(!(ready.fotos&&ready.catalogo&&ready.decisoes))return;
  if(!photos.length){$('grid').innerHTML='<div class="empty">Nenhuma foto cadastrada ainda. Peça ao Claude para carregar as fotos.</div>';renderBar();return}
  const list=photos.filter(inFilter);
  $('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Nenhuma foto neste filtro.</div>';
  $('grid').querySelectorAll('select[data-main]').forEach(syncMain);$('grid').querySelectorAll('[data-card]').forEach(markMissing);renderBar()}
function refreshCard(photo){const el=$('grid').querySelector('[data-card="'+CSS.escape(photo)+'"]');if(!el){renderBar();return}
  if(el.contains(document.activeElement)&&document.activeElement.matches('input,textarea')){markMissing(el);renderBar();return}
  const p=photos.find(x=>x.id===photo),t=document.createElement('div');t.innerHTML=card(p);const fresh=t.firstElementChild;
  fresh.querySelector('.photo').replaceWith(el.querySelector('.photo'));fresh.querySelector('.photo img').setAttribute('style',rotStyle((decisions[photo]||{}).rotacao));
  el.replaceWith(fresh);syncMain(fresh.querySelector('select[data-main]'));markMissing(fresh);renderBar()}

// ---------- events ----------
$('grid').addEventListener('change',e=>{const el=e.target;
  if(el.dataset.main){setChoice(el.dataset.main,el.value);refreshCard(el.dataset.main)}
  else if(el.matches('select[data-k]')){decisions[el.dataset.p]=Object.assign({},decisions[el.dataset.p],{[el.dataset.k]:el.value});queue(el.dataset.p,0);markMissing(el.closest('[data-card]'))}});
$('grid').addEventListener('input',e=>{const el=e.target;if(el.matches('input[data-k],textarea[data-k]')){decisions[el.dataset.p]=Object.assign({},decisions[el.dataset.p],{[el.dataset.k]:el.value});queue(el.dataset.p);markMissing(el.closest('[data-card]'))}});
$('grid').addEventListener('click',e=>{const u=e.target.closest('[data-use]'),r=e.target.closest('[data-rot]'),q=e.target.closest('[data-quick]'),
  cf=e.target.closest('[data-confirm]'),rs=e.target.closest('[data-reshoot]');
  // Quick buttons toggle: a second tap on the active one clears the decision. Excluding asks for a second tap first.
  if(q){const p=q.dataset.p,cur=value(photos.find(x=>x.id===p)),want=q.dataset.quick;
    if(want==='excluida'&&cur!=='excluida'&&!q.dataset.armed){q.dataset.armed='1';q.classList.add('armed');q.textContent='Toque de novo para excluir';
      setTimeout(()=>{if(q.isConnected){delete q.dataset.armed;q.classList.remove('armed');q.textContent='Excluir'}},3500);return}
    setChoice(p,cur===want?'':want);refreshCard(p)}
  if(cf){const p=cf.dataset.confirm,d=Object.assign({},decisions[p]);d.confirmado=!isConfirmed(d);decisions[p]=d;queue(p,0);refreshCard(p)}
  if(rs){const p=rs.dataset.reshoot,ph=photos.find(x=>x.id===p),d=Object.assign({},decisions[p]);d.refotografar=!reshoot(ph);decisions[p]=d;queue(p,0);refreshCard(p)}
  if(u){setChoice(u.dataset.use,u.dataset.id);refreshCard(u.dataset.use)}
  if(r){const p=r.dataset.p,d=Object.assign({},decisions[p]);d.rotacao=(((d.rotacao||0)+Number(r.dataset.rot))%360+360)%360;decisions[p]=d;
    const img=r.closest('.photo').querySelector('img');img.setAttribute('style',rotStyle(d.rotacao));queue(p,400)}});
// Re-applies the current filter, so photos confirmed or excluded in this visit leave the list
$('refreshList').addEventListener('click',()=>{Object.keys(pending).forEach(p=>{clearTimeout(timers[p]);flush(p)});render();window.scrollTo({top:0})});
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}});

// ---------- data ----------
(async function start(){
  db=await claude.use('db');
  if(!db){setSave('error','Sem conexão com o salvamento');$('grid').innerHTML='<div class="empty">Abra esta página pelo claude.ai, com seu login, para ver e salvar a revisão.</div>';$('saveNow').hidden=true;return}
  setSave('','Tudo salvo');
  const fail=()=>setSave('error','A conexão caiu. Recarregue a página.');
  db.collection('fotos').onSnapshot(s=>{photos=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>a.id.localeCompare(b.id));ready.fotos=true;render()},fail);
  db.collection('catalogo').onSnapshot(s=>{catalog=s.docs.map(d=>Object.assign({id:d.id},d.data()));byId=Object.fromEntries(catalog.map(c=>[c.id,c]));ready.catalogo=true;render()},fail);
  db.collection('decisoes').onSnapshot(s=>{const first=!ready.decisoes;
    s.docChanges().forEach(ch=>{const id=ch.doc.id;if(pending[id]||inflight[id])return;// keep what is being typed here
      if(ch.type==='removed')delete decisions[id];else decisions[id]=Object.assign({},ch.doc.data())});
    ready.decisoes=true;if(first)render();else s.docChanges().forEach(ch=>refreshCard(ch.doc.id))},fail);
})();
})();
</script>
